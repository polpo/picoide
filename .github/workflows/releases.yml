name: Rebuild website for releases

# Release events run against the release's tag, which may point at an old
# commit and isn't allowed to deploy to the github-pages environment, so
# trigger a pages workflow run on main.
on:
  release:
    types: [published, unpublished, edited, deleted]

permissions:
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
