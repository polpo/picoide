site_name: PicoIDE Documentation
site_description: Documentation for PicoIDE - open IDE/ATAPI device emulator for retro computers
repo_url: https://github.com/polpo/picoide
repo_name: polpo/picoide
edit_uri: edit/main/docs/src/

docs_dir: src

theme:
  name: material
  logo: https://picoide.com/favicon.png
  favicon: https://picoide.com/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - SD Card Setup: sd-card.md
  - Front Panel: front-panel.md
  - Web Interface: web-interface.md
  - Host Control (pidectl): pidectl.md
  - Firmware Updates: firmware-updates.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css
