[project]
site_name = "PicoIDE"
site_description = "PicoIDE is an open source IDE/ATAPI drive emulator for retro computers that supports CD-ROM and hard drives with optional WiFi front panel interface."
site_url = "https://picoide.com/"
repo_url = "https://github.com/polpo/picoide"
repo_name = "polpo/picoide"
edit_uri = "edit/main/website/src/"

docs_dir = "src"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Documentation" = [
    "docs/index.md",
    { "Getting Started" = "docs/getting-started.md" },
    { "SD Card Setup" = "docs/sd-card.md" },
    { "Front Panel" = "docs/front-panel.md" },
    { "Web Interface" = "docs/web-interface.md" },
    { "Host Control (pidectl)" = "docs/pidectl.md" },
    { "Firmware Updates" = "docs/firmware-updates.md" },
  ] },
  { "Releases" = "releases.md" },
]

extra_css = ["assets/stylesheets/extra.css", "assets/stylesheets/home.css"]

[project.theme]
variant = "modern"
custom_dir = "overrides"
logo = "favicon.png"
favicon = "favicon.png"
language = "en"
features = [
  "navigation.tabs",
  "navigation.indexes",
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
]

[project.theme.font]
text = "IBM Plex Sans"
code = "IBM Plex Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Default: follow the system light/dark setting. The toggle cycles
# system -> light -> dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "red"
accent = "red"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "red"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "red"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
md_in_html = {}
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.tabbed.alternate_style = true
tables = {}
attr_list = {}
toc.permalink = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"

# enable rendering of releases via macro
[project.plugins.macros]
module_name = "releases"
render_by_default = false
on_error_fail = true
